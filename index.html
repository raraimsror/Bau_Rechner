<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemontExpert 3D Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- jsPDF библиотека для PDF экспорта (локальная версия) -->
    <script src="libs/jspdf.umd.min.js"></script>
    <script src="scripts/lang.js" defer></script>
    <script src="locales/pdf-disclaimer.js" defer></script>
    <script src="scripts/openings.js" defer></script>
    <script src="scripts/room3d.js" defer></script>
    <script src="scripts/paint.js" defer></script>
    <script src="scripts/wallpaper.js" defer></script>
    <script src="scripts/tech-card.js" defer></script>
    <script src="scripts/work-stages.js" defer></script>
    <script src="scripts/ECO.js" defer></script>
    <script src="scripts/NORM.js" defer></script>
    <script src="scripts/PRO.js" defer></script>
    <script src="scripts/script.js" defer></script>
    <script src="scripts/pdf-export.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html" class="brand">
            <img src="pics/Logo.png" alt="RemontExpert Logo" class="brand-logo">
            <span class="brand-name">RemontExpert <span class="accent">3D</span></span>
        </a>
        <div class="header-actions">
            <a href="#" class="login-btn" data-i18n="loginRegister">Вход / Регистрация</a>
            <div class="segmented lang-segmented" id="langSegmented" data-i18n-title="langSwitchTitle" title="Language">
                <span class="segmented-slider" aria-hidden="true"></span>
                <label class="segmented-option">
                    <input type="radio" name="lang" value="ru">
                    <span>Рус</span>
                </label>
                <label class="segmented-option">
                    <input type="radio" name="lang" value="en">
                    <span>Eng</span>
                </label>
                <label class="segmented-option">
                    <input type="radio" name="lang" value="de">
                    <span>Deu</span>
                </label>
            </div>
        </div>
    </header>

    <div class="layout">

        <!-- ================= ЛЕВАЯ КОЛОНКА: ФИЛЬТРЫ ================= -->
        <div class="panel left-panel">
            <h3>
                <span><span class="panel-title-icon">▣</span> <span data-i18n="filters">Фильтры</span></span>
                <button id="resetFiltersBtn"
                data-i18n-title="resetFilters"
                title="Сбросить фильтры"
                class="reset-btn rotate-on-hover">⟳</button>
            </h3>

            <div class="input-block">
                <h4><span data-i18n="jobTypes">Тип работ</span></h4>
                <div class="segmented job-type-segmented">
                    <span class="segmented-slider" aria-hidden="true"></span>
                    <label class="segmented-option">
                        <input type="radio" name="jobType" value="painting" checked>
                        <span data-i18n="painting">Покраска</span>
                    </label>
                    <label class="segmented-option">
                        <input type="radio" name="jobType" value="wallpaper">
                        <span data-i18n="wallpaper">Поклейка обоев</span>
                    </label>
                </div>
            </div>

            <div class="input-block xyz_value_inputs">
                <h4><span data-i18n="roomSize">Размеры комнаты (см)</span> <button id="roomInfoBtn" class="info-btn" data-i18n-title="infoBtnTitle" title="Как измерить помещение">ℹ️</button></h4>
                <div class="xyz-inputs">
                    <label class="xyz-field">
                        <span>X</span>
                        <input id="xInp" type="number" value="400" placeholder="X" min="1" max="10000">
                    </label>
                    <label class="xyz-field">
                        <span>Y</span>
                        <input id="yInp" type="number" value="300" placeholder="Y" min="1" max="10000">
                    </label>
                    <label class="xyz-field">
                        <span>Z</span>
                        <input id="zInp" type="number" value="250" placeholder="Z" min="1" max="10000">
                    </label>
                </div>
            </div>

            <div class="input-block">
                <label class="switch-row">
                    <span class="switch-label" data-i18n="selectAll">Выбрать всё</span>
                    <span class="switch">
                        <input type="checkbox" id="selectAll">
                        <span class="slider"></span>
                    </span>
                </label>
                <label class="switch-row">
                    <span class="switch-label" data-i18n="frontWall">Передняя стена</span>
                    <span class="switch">
                        <input type="checkbox" class="plane-toggle" data-side="front" checked>
                        <span class="slider"></span>
                    </span>
                </label>
                <label class="switch-row">
                    <span class="switch-label" data-i18n="backWall">Задняя стена</span>
                    <span class="switch">
                        <input type="checkbox" class="plane-toggle" data-side="back" checked>
                        <span class="slider"></span>
                    </span>
                </label>
                <label class="switch-row">
                    <span class="switch-label" data-i18n="leftWall">Левая стена</span>
                    <span class="switch">
                        <input type="checkbox" class="plane-toggle" data-side="left" checked>
                        <span class="slider"></span>
                    </span>
                </label>
                <label class="switch-row">
                    <span class="switch-label" data-i18n="rightWall">Правая стена</span>
                    <span class="switch">
                        <input type="checkbox" class="plane-toggle" data-side="right" checked>
                        <span class="slider"></span>
                    </span>
                </label>
                <label class="switch-row">
                    <span class="switch-label" data-i18n="floor">Пол</span>
                    <span class="switch">
                        <input type="checkbox" class="plane-toggle" data-side="floor">
                        <span class="slider"></span>
                    </span>
                </label>
                <label class="switch-row">
                    <span class="switch-label" data-i18n="ceiling">Потолок</span>
                    <span class="switch">
                        <input type="checkbox" class="plane-toggle" data-side="ceiling" checked>
                        <span class="slider"></span>
                    </span>
                </label>
            </div>
        </div>

        <!-- ================= ЦЕНТРАЛЬНАЯ КОЛОНКА: 3D ================= -->
        <div class="center-panel">

            <div class="viewport" id="vPort">
                <div class="viewport-reset" data-i18n-title="resetView" title="Сбросить вид (как F5)">
                    <img class="xyz_img" src="pics/xyz-reset.jpg" alt="reset">
                </div>

                <div class="scene three-d" id="zoomScene">
                    <div class="room three-d" id="room">
                        <div class="wall front" data-side="front"></div>
                        <div class="wall back" data-side="back"></div>
                        <div class="wall left" data-side="left"></div>
                        <div class="wall right" data-side="right"></div>
                        <div class="wall floor" data-side="floor"></div>
                        <div class="wall ceiling" data-side="ceiling">
                            <div class="lamp"></div>
                        </div>
                    </div>
                </div>

                <div class="viewport-hint" data-i18n="viewportHint">⟲ drag · rotate</div>
            </div>

        </div>

        <!-- ================= ПРАВАЯ КОЛОНКА: КЛАСС + МАГАЗИН + РЕЗУЛЬТАТЫ ================= -->
        <div class="panel right-panel">
            <div class="input-block">
                <h4><span data-i18n="repairClass">Класс ремонта</span></h4>
                <div class="class-cards">
                    <label class="class-card" data-i18n-title="econom" title="Эконом - только материалы, клиент работает сам">
                        <input type="radio" name="repairClass" value="econom" checked>
                        <span class="class-badge econom">ECO</span>
                        <span class="class-info">
                            <span class="class-title">ECO</span>
                            <span class="class-desc" data-i18n="economyDesc">материалы + инструменты</span>
                        </span>
                        <span class="class-check"></span>
                    </label>
                    <label class="class-card" data-i18n-title="standard" title="Стандарт - выбор работ + связь с мастерами">
                        <input type="radio" name="repairClass" value="standard">
                        <span class="class-badge standard">NORM</span>
                        <span class="class-info">
                            <span class="class-title">NORM</span>
                            <span class="class-desc" data-i18n="standardDesc">работы + материалы</span>
                        </span>
                        <span class="class-check"></span>
                    </label>
                    <label class="class-card" data-i18n-title="premium" title="Премиум - полный сервис под ключ">
                        <input type="radio" name="repairClass" value="premium">
                        <span class="class-badge premium">PRO</span>
                        <span class="class-info">
                            <span class="class-title">PRO</span>
                            <span class="class-desc" data-i18n="premiumDesc">полный сервис под ключ</span>
                        </span>
                        <span class="class-check"></span>
                    </label>
                </div>
            </div>

            <div class="input-block">
                <h4><span data-i18n="storeSelect">Выбор магазина</span></h4>
                <div class="store-grid">
                    <label class="store-btn" data-store="default" title="По умолчанию">
                        <input type="radio" name="store" value="default" checked>
                        <span class="store-name">A</span>
                    </label>
                    <label class="store-btn" data-store="obi" title="OBI">
                        <input type="radio" name="store" value="obi">
                        <img src="pics/logo_obi.png" alt="OBI" class="store-img">
                    </label>
                    <label class="store-btn" data-store="hornbach" title="Hornbach">
                        <input type="radio" name="store" value="hornbach">
                        <img src="pics/logo_hornbach.png" alt="Hornbach" class="store-img">
                    </label>
                    <label class="store-btn" data-store="bauhaus" title="Bauhaus">
                        <input type="radio" name="store" value="bauhaus">
                        <img src="pics/logo_bauhaus.png" alt="Bauhaus" class="store-img">
                    </label>
                </div>
            </div>

            <h3>
                <span><span class="panel-title-icon">▤</span> <span data-i18n="results">Результаты</span></span>
                <button id="resetWorkBlocksBtn"
                data-i18n-title="resetWorkBlocks"
                title="Сбросить выбор работ"
                class="reset-btn rotate-on-hover">⟳</button>
            </h3>
            <div id="resultsBox"></div>
        </div>

    </div>

    <div class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="pages/about.html" data-i18n="aboutUs">О нас</a>
                <a href="pages/partners.html" data-i18n="partners">Партнеры</a>
                <a href="pages/mission.html" data-i18n="mission">Миссия</a>
                <a href="pages/contacts.html" data-i18n="contacts">Контакты</a>
            </div>
            <div class="footer-links" style="margin-top: 10px; font-size: 0.9em;">
                <a href="pages/impressum.html">Impressum</a>
                <a href="pages/datenschutz.html">Datenschutz</a>
                <a href="pages/disclaimer.html">Haftungsausschluss</a>
            </div>
            <span data-i18n="copyright">© 2026 RemontExpert — Все права защищены</span>
        </div>
    </div>
<link rel="stylesheet" href="info-modal.css"><script src="scripts/info-modal.js"></script>
</body>

</html>
